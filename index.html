
<!DOCTYPE html> 
<html lang="en">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICSES 2026 | Research Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { 
            --brand-charcoal: #231F20;
            --brand-sienna: #A74424;
            --brand-green: #67C18C;
            --brand-teal: #4BB3A6;
            --brand-red: #8C191B;

            --bg-soft: #f5f4f2;
            --bg-panel: #ffffff;
            --text-muted: #6a6767;
            --border-soft: rgba(35, 31, 32, 0.10);
            --shadow-soft: 0 16px 40px rgba(35, 31, 32, 0.08);
        }
        
        body { 
            background: linear-gradient(180deg, #f7f5f2 0%, #f1efeb 100%);
            color: var(--brand-charcoal); 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
            margin: 0; 
            padding: 28px 20px 40px; 
            text-align: center;
            min-height: 100vh;
        }

        .page-wrap {
            max-width: 1280px;
            margin: 0 auto;
        }

        h1 { 
            margin: 8px 0 10px; 
            font-weight: 800; 
            letter-spacing: -1px; 
            color: var(--brand-charcoal);
            font-size: clamp(2rem, 4vw, 3.1rem);
            line-height: 1.05;
        }
        
        p.subtitle {
            opacity: 1;
            margin: 0 auto 30px;
            font-size: 1.08rem;
            color: var(--text-muted);
            max-width: 720px;
            line-height: 1.5;
        }

        .stats-grid {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 0 auto 28px;
            flex-wrap: wrap;
            max-width: 900px;
        }

        .stat-card {
            background: var(--bg-panel);
            border: 1px solid var(--border-soft);
            border-radius: 22px;
            padding: 22px 28px;
            min-width: 240px;
            box-shadow: var(--shadow-soft);
        }

        .num { 
            font-size: 3rem; 
            font-weight: 800; 
            color: var(--brand-green); 
            display: block; 
            line-height: 1;
            margin-bottom: 8px;
        }

        .label { 
            font-size: 0.8rem; 
            text-transform: uppercase; 
            letter-spacing: 1.8px; 
            color: var(--brand-charcoal); 
            opacity: 0.8;
            display: block;
        }

        .btn-container {
            margin: 10px 0 30px;
        }

        .register-btn {
            display: inline-block;
            background: var(--brand-sienna);
            color: white;
            padding: 15px 34px;
            border-radius: 999px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1rem;
            border: none;
            transition: all 0.25s ease;
            box-shadow: 0 10px 24px rgba(167, 68, 36, 0.18);
        }

        .register-btn:hover { 
            background: var(--brand-teal);
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(75, 179, 166, 0.22);
        }

        .map-card {
            background: var(--bg-panel);
            border: 1px solid var(--border-soft);
            border-radius: 28px;
            padding: 14px;
            box-shadow: 0 20px 50px rgba(35, 31, 32, 0.10);
        }

        #map { 
            height: 680px; 
            width: 100%; 
            border-radius: 20px; 
            background: #eef2f1;
        }

        .ping-marker {
            background: var(--brand-teal);
            border: 2px solid white;
            border-radius: 50%;
            animation: pulse-brand 2.4s infinite;
            box-shadow: 0 2px 8px rgba(35, 31, 32, 0.18);
        }

        @keyframes pulse-brand {
            0% { box-shadow: 0 0 0 0 rgba(75, 179, 166, 0.35); }
            70% { box-shadow: 0 0 0 12px rgba(75, 179, 166, 0); }
            100% { box-shadow: 0 0 0 0 rgba(75, 179, 166, 0); }
        }

        .leaflet-tooltip { 
            background: white !important; 
            color: var(--brand-charcoal) !important; 
            border: 1px solid rgba(167, 68, 36, 0.22) !important; 
            border-radius: 12px; 
            padding: 10px 12px; 
            font-weight: 600;
            box-shadow: 0 8px 20px rgba(35, 31, 32, 0.12);
        }

        .leaflet-control-attribution { 
            background: rgba(255, 255, 255, 0.88) !important; 
            color: #666 !important; 
            border-radius: 10px 0 0 0;
            backdrop-filter: blur(4px);
        }

        .leaflet-container {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        @media (max-width: 900px) {
            #map {
                height: 560px;
            }
        }

        @media (max-width: 640px) {
            body {
                padding: 20px 14px 28px;
            }

            .stat-card {
                min-width: unset;
                width: 100%;
            }

            .num {
                font-size: 2.5rem;
            }

            #map {
                height: 480px;
            }

            .register-btn {
                width: 100%;
                max-width: 320px;
            }
        }
    </style>
</head>
<body>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQyTF3WaRtgKPHTVpnZwUPUyzMwq2_GkDu0-B0A1SvGiMZwGDGCCsu52XS-tf6Cc-LyF7VPWdkB7B43/pub?output=csv';

        const map = L.map('map', { 
            center: [20, 10], 
            zoom: 2, 
            minZoom: 1.5,

            zoomControl: false, 
            attributionControl: true

        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'
        }).addTo(map);

        const hubs = {

        function toTitleCase(str) {
            return str
                .toLowerCase()
                .replace(/\b\w/g, char => char.toUpperCase());
        }

        function normalizeCity(city, country = '') {
            if (!city) return '';

            city = city.trim().replace(/\s+/g, ' ');
            const countryNormalized = (country || '').trim().toLowerCase();

            const aliasMap = {
                'Montréal': 'Montreal',
                'Zürich': 'Zurich',
                'Toyko': 'Tokyo',
                'St Louis': 'St. Louis',
                'Saint Louis': 'St. Louis',
                'St Catharines': 'St. Catharines',
                'Sao Paulo': 'São Paulo',
                'Bogota': 'Bogotá',
                'Brasilia': 'Brasília',
                'Lisboa': 'Lisbon',
                'Busam': 'Busan',
                'Osaka-city': 'Osaka',
                'Yokohama, Kanagawa': 'Yokohama',
                'Hamamatsu, Shizuoka': 'Hamamatsu',
                'Hamamatsu Tyuuouku': 'Hamamatsu',
                'Funabashi Chiba': 'Funabashi',
                'Funabashi ,Chiba': 'Funabashi',
                'Funabashi, Chiba': 'Funabashi',
                'Shinjuku-ku, Tokyo': 'Tokyo',
                'Hachioji, Tokyo': 'Tokyo',
                'Aoba-ku, Sendai': 'Sendai',
                'Ayabe-shi, Kyoto': 'Kyoto',
                'Kyotanabe, Kyoto': 'Kyoto',
                'Kogarah, NSW': 'Kogarah',
                'Ansan-si, Gyeonggi-do': 'Ansan',
                'Bucheon-si, Gyeonggi-do': 'Bucheon',
                'Pohang-si, Nam-gu': 'Pohang',
                'Yeosu-si': 'Yeosu',
                'Goyang-si': 'Goyang',
                'Goyang-sI': 'Goyang',
                'Seongnam-si': 'Seongnam',
                'Seong Nam': 'Seongnam',
                'Sungnamsi': 'Seongnam',
                'Sejong-si': 'Sejong',
                'lyon': 'Lyon',
                'LYON': 'Lyon',
                'paris': 'Paris',
                'london': 'London',
                'kyoto': 'Kyoto',
                'brisbane': 'Brisbane',
                'durham': 'Durham',
                'hyderabad': 'Hyderabad',
                'khobar': 'Al Khobar',
                'AlShuhada': 'Kuwait City',
                'MEDELLIN': 'Medellin',
                'ZARAGOZA': 'Zaragoza',
                'VALENCIA': 'Valencia',
                'IZMIR': 'Izmir',
                'JOINVILLE': 'Joinville',
                'BUFFALO': 'Buffalo',
                'MUMBAI': 'Mumbai',
                'DURBAN': 'Durban',
                'GWANGJU': 'Gwangju',
                'TOURS': 'Tours',
                'CUIDAD DE MEXICO': 'Mexico City',
                'Ciudad de Mexico': 'Mexico City',
                'Ciudad de México': 'Mexico City',
                'las condes, santiago': 'Santiago',
                'Las Condes, Santiago': 'Santiago',
                'viña del mar': 'Viña del Mar',
                'petah Tikva': 'Petah Tikva',
                'Panamá': 'Panama City',
                'Berne': 'Bern',
                'Milano': 'Milan',
                'Roma': 'Rome',
                'Napoli': 'Naples',
                'latina': 'Latina',
                'higashiosaka': 'Higashiosaka',
                'chihuahua': 'Chihuahua',
                'doha': 'Doha',
                'derby': 'Derby',
                'clayton': 'Clayton',
                'toulouse': 'Toulouse',
                'quito': 'Quito',
                'Santo André - SP': 'Santo André',
                'Jaragua do Sul': 'Jaraguá do Sul',
                'CAPITAL FEDERAL': 'Capital Federal'
            };

            if (aliasMap[city]) return aliasMap[city];

            if (/^.+,\s*Tokyo$/i.test(city)) return 'Tokyo';
            if (/^.+,\s*Kyoto$/i.test(city)) return 'Kyoto';
            if (/^.+,\s*Chiba$/i.test(city)) return 'Funabashi';
            if (/^.+,\s*Shizuoka$/i.test(city)) return 'Hamamatsu';
            if (/^.+,\s*Kanagawa$/i.test(city)) return 'Yokohama';
            if (/^.+,\s*Victoria$/i.test(city) && countryNormalized === 'australia') return 'Melbourne';
            if (/^.+,\s*Gyeonggi-do$/i.test(city)) return 'Ansan';
            if (/^.+,\s*Santiago$/i.test(city)) return 'Santiago';
            if (/^.+,\s*Chih\.$/i.test(city)) return 'Chihuahua';

            const titleCased = toTitleCase(city);

            if (aliasMap[titleCased]) return aliasMap[titleCased];

            return titleCased;
        }

        async function loadData() {
            try {
                const res = await fetch(csvUrl);
                if (!res.ok) throw new Error('Could not fetch CSV');
                
                const csv = await res.text();
                const lines = csv.split(/\r?\n/).filter(line => line.trim() !== '');
                const dataRows = lines.slice(1);
                
                const countries = new Set();
                const processedCities = new Set(); 
                let submissions = 0;

                dataRows.forEach(line => {
                    const cols = line
                        .split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/)
                        .map(c => c.trim().replace(/^"|"$/g, ''));

                    let city = cols[0] || '';
                    const country = cols[1] || '';

                    if (!city && !country) return;
                    
                    submissions++;
                    if (country) countries.add(country);

                    city = normalizeCity(city, country);

                    if (hubs[city] && !processedCities.has(city)) {
                        const icon = L.divIcon({
                            className: 'ping-marker',
                            iconSize: [12, 12]
                        });

                        L.marker(hubs[city], { icon }).addTo(map)
                            .bindTooltip(`${city}, ${country}`, {
                                direction: 'top',
                                offset: [0, -8]
                            });

                        processedCities.add(city);
                    }
                });

                document.getElementById('count-abstracts').innerText = submissions.toLocaleString();
                document.getElementById('count-nations').innerText = countries.size;

            } catch (e) { 
                console.error('Error loading CSV data:', e); 
            }
        }
        
        loadData();
    </script>
