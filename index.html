<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ICSES 2026 | Research Map</title>

    <!-- Leaflet -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <!-- Leaflet marker clustering -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
    >
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"
    >

    <style>
        :root {
            --map-marker-colour: #077F9C;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI",
                sans-serif;
        }

        #map {
            width: 100%;
            height: 680px;
            min-height: 420px;
            background: #eef2f1;
        }

        /*
         * Individual location marker.
         */
        .research-marker {
            width: 14px;
            height: 14px;
            background: var(--map-marker-colour);
            border: 2px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 2px 7px rgba(0, 0, 0, 0.25);
        }

        /*
         * Cluster marker container.
         */
        .research-cluster {
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
        }

        /*
         * Visible cluster circle.
         */
        .research-cluster-circle {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            background: var(--map-marker-colour);
            border: 3px solid rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            box-shadow:
                0 0 0 5px rgba(7, 127, 156, 0.18),
                0 3px 10px rgba(0, 0, 0, 0.2);
            color: #ffffff;
            font-size: 13px;
            font-weight: 700;
        }

        /*
         * Slightly larger clusters.
         */
        .research-cluster.medium .research-cluster-circle {
            width: 46px;
            height: 46px;
            box-shadow:
                0 0 0 6px rgba(7, 127, 156, 0.2),
                0 3px 10px rgba(0, 0, 0, 0.2);
        }

        .research-cluster.large .research-cluster-circle {
            width: 52px;
            height: 52px;
            box-shadow:
                0 0 0 7px rgba(7, 127, 156, 0.22),
                0 3px 10px rgba(0, 0, 0, 0.2);
        }

        /*
         * Location tooltip.
         */
        .leaflet-tooltip {
            padding: 8px 11px;
            background: #ffffff !important;
            border: 1px solid rgba(7, 127, 156, 0.3) !important;
            border-radius: 8px;
            box-shadow: 0 7px 18px rgba(0, 0, 0, 0.14);
            color: #231f20 !important;
            font-size: 13px;
            font-weight: 600;
        }

        .leaflet-tooltip-top::before {
            border-top-color: rgba(7, 127, 156, 0.3) !important;
        }

        /*
         * Zoom controls.
         */
        .leaflet-control-zoom {
            overflow: hidden;
            border: 0 !important;
            border-radius: 10px !important;
            box-shadow: 0 5px 16px rgba(0, 0, 0, 0.15) !important;
        }

        .leaflet-control-zoom a {
            color: #077F9C !important;
        }

        .leaflet-control-attribution {
            background: rgba(255, 255, 255, 0.88) !important;
            color: #666666 !important;
        }

        /*
         * Cluster expansion lines.
         */
        .leaflet-cluster-spider-leg {
            stroke: #077F9C;
            stroke-width: 1.5;
            stroke-opacity: 0.65;
        }

        @media (max-width: 900px) {
            #map {
                height: 560px;
            }
        }

        @media (max-width: 640px) {
            #map {
                height: 480px;
            }
        }
    </style>
</head>

<body>
    <div
        id="map"
        role="application"
        aria-label="Interactive map of research locations"
    ></div>

    <!-- Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Leaflet marker clustering -->
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

    <script>
        const csvUrl =
            "https://docs.google.com/spreadsheets/d/e/2PACX-1vQyTF3WaRtgKPHTVpnZwUPUyzMwq2_GkDu0-B0A1SvGiMZwGDGCCsu52XS-tf6Cc-LyF7VPWdkB7B43/pub?output=csv";

        const hubs = {
            "C.A.B.A.": [-34.6037, -58.3816],
            "Buenos Aires": [-34.6037, -58.3816],
            "Adelaide": [-34.9285, 138.6007],
            "Antwerpen": [51.2194, 4.4025],
            "Fortaleza": [-3.7319, -38.5267],
            "Varna": [43.2141, 27.9147],
            "Ottawa": [45.4215, -75.6972],
            "Toronto": [43.6532, -79.3832],
            "Montreal": [45.5019, -73.5674],
            "Guangzhou": [23.1291, 113.2644],
            "Shenzhen": [22.5431, 114.0579],
            "Hangzhou": [30.2741, 120.1551],
            "Olomouc": [49.5938, 17.2509],
            "Cairo": [30.0444, 31.2357],
            "Toulouse": [43.6047, 1.4442],
            "Nice": [43.7102, 7.262],
            "Münster": [51.9607, 7.6261],
            "Hilden": [51.1679, 6.9307],
            "Athens": [37.9838, 23.7275],
            "Budapest": [47.4979, 19.0402],
            "Chandigarh": [30.7333, 76.7794],
            "Ahmedabad": [23.0225, 72.5714],
            "Chennai": [13.0827, 80.2707],
            "Bengaluru": [12.9716, 77.5946],
            "Mumbai": [19.076, 72.8777],
            "Binyamina": [32.518, 34.9458],
            "Naples": [40.8518, 14.2681],
            "Bagnatica": [45.6602, 9.7817],
            "Cagliari": [39.2238, 9.1217],
            "Genova": [44.4056, 8.9463],
            "Biella": [45.5629, 8.0583],
            "Pisa": [43.7228, 10.4017],
            "Bologna": [44.4949, 11.3426],
            "Parma": [44.8015, 10.3279],
            "Bergamo": [45.6983, 9.6773],
            "Catania": [37.5079, 15.083],
            "Rome": [41.9028, 12.4964],
            "Milan": [45.4642, 9.19],
            "Bari": [41.1171, 16.8719],
            "Strassen": [49.6206, 6.0733],
            "Mexico City": [19.4326, -99.1332],
            "Rabat": [34.0209, -6.8416],
            "Obafemi-Owode": [6.9463, 3.505],
            "Porto": [41.1579, -8.6291],
            "Daegu": [35.8714, 128.6014],
            "Seoul": [37.5665, 126.978],
            "Madrid": [40.4168, -3.7038],
            "Hernani": [43.2662, -1.9761],
            "Galapagar": [40.5783, -4.0043],
            "Granada": [37.1773, -3.5986],
            "Valencia": [39.4699, -0.3763],
            "Barcelona": [41.3874, 2.1686],
            "Vila-seca": [41.1112, 1.1477],
            "Majadahonda": [40.4738, -3.8718],
            "Bilbao": [43.263, -2.935],
            "Santiago de Compostela": [42.8782, -8.5448],
            "Pamplona": [42.8125, -1.6458],
            "Málaga": [36.7213, -4.4214],
            "Belfast": [54.5973, -5.9301],
            "Cambridge": [52.2053, 0.1218],
            "Colchester": [51.8959, 0.8919],
            "London": [51.5074, -0.1278],
            "New York": [40.7128, -74.006],
            "Philadelphia": [39.9526, -75.1652],
            "Boca Raton": [26.3683, -80.1289],
            "West Los Angeles": [34.0412, -118.4426],
            "Porter Ranch": [34.2822, -118.5506],
            "Madison": [43.0731, -89.4012],
            "Minneapolis": [44.9778, -93.265],
            "Rochester": [43.1566, -77.6088],
            "Chicago": [41.8781, -87.6298],
            "Sparks": [39.5349, -119.7527]
        };

        /*
         * Used when the spreadsheet includes a country but no city.
         */
        const countryFallbacks = {
            "Canada": [56.1304, -106.3468],
            "China": [35.8617, 104.1954],
            "Egypt": [26.8206, 30.8025],
            "France": [46.2276, 2.2137],
            "Germany": [51.1657, 10.4515],
            "India": [20.5937, 78.9629],
            "Italy": [41.8719, 12.5674],
            "Mexico": [23.6345, -102.5528],
            "Netherlands": [52.1326, 5.2913],
            "New Zealand": [-40.9006, 174.886],
            "Republic of Korea": [35.9078, 127.7669],
            "Singapore": [1.3521, 103.8198],
            "Slovenia": [46.1512, 14.9955],
            "Spain": [40.4637, -3.7492],
            "Sweden": [60.1282, 18.6435],
            "Turkey": [38.9637, 35.2433],
            "United Kingdom": [55.3781, -3.436],
            "United States": [39.8283, -98.5795]
        };

        const cityAliases = {
            "c a b a": "C.A.B.A.",
            "capital federal": "C.A.B.A.",
            "montreal": "Montreal",
            "munster": "Münster",
            "hilden": "Hilden",
            "athens": "Athens",
            "naples italy": "Naples",
            "napoli": "Naples",
            "cagliari": "Cagliari",
            "milano": "Milan",
            "roma": "Rome",
            "hernani": "Hernani",
            "valencia": "Valencia",
            "vila seca": "Vila-seca",
            "malaga": "Málaga",
            "sabino arana 5": "Bilbao",
            "west los angeles": "West Los Angeles"
        };

        const map = L.map("map", {
            center: [20, 10],
            zoom: 2,
            minZoom: 1,
            maxZoom: 18,
            zoomControl: true,
            attributionControl: true,
            worldCopyJump: true
        });

        L.tileLayer(
            "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
            {
                attribution:
                    '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
                subdomains: "abcd",
                maxZoom: 20
            }
        ).addTo(map);

        /*
         * Every spreadsheet row gets its own marker.
         *
         * Nearby markers are grouped into clusters. At the highest zoom,
         * markers sharing the same coordinates expand into a spider layout.
         */
        const markerClusters = L.markerClusterGroup({
            showCoverageOnHover: false,
            zoomToBoundsOnClick: true,
            spiderfyOnMaxZoom: true,
            removeOutsideVisibleBounds: true,
            animate: true,
            maxClusterRadius: 45,

            spiderfyDistanceMultiplier: 1.5,

            iconCreateFunction(cluster) {
                const count = cluster.getChildCount();

                let sizeClass = "";

                if (count >= 20) {
                    sizeClass = "large";
                } else if (count >= 10) {
                    sizeClass = "medium";
                }

                const dimensions =
                    count >= 20 ? 52 :
                    count >= 10 ? 46 :
                    40;

                return L.divIcon({
                    className: `research-cluster ${sizeClass}`,
                    html: `
                        <div class="research-cluster-circle">
                            ${count}
                        </div>
                    `,
                    iconSize: [dimensions, dimensions],
                    iconAnchor: [dimensions / 2, dimensions / 2]
                });
            }
        });

        map.addLayer(markerClusters);

        function normalizeLookupText(value) {
            return String(value || "")
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .replace(/[’']/g, "")
                .replace(/[.,/#!$%^&*;:{}=\-_`~()]/g, " ")
                .replace(/\s+/g, " ")
                .trim()
                .toLowerCase();
        }

        function createCanonicalCityLookup() {
            const lookup = {};

            Object.keys(hubs).forEach((city) => {
                lookup[normalizeLookupText(city)] = city;
            });

            return lookup;
        }

        const canonicalCityLookup = createCanonicalCityLookup();

        function normalizeCountry(country) {
            const cleaned = String(country || "")
                .trim()
                .replace(/\s+/g, " ");

            const lookupKey = normalizeLookupText(cleaned);

            const aliases = {
                "republic of korea": "Republic of Korea",
                "south korea": "Republic of Korea",
                "korea republic of": "Republic of Korea",
                "uk": "United Kingdom",
                "u k": "United Kingdom",
                "usa": "United States",
                "u s a": "United States",
                "united states of america": "United States"
            };

            return aliases[lookupKey] || cleaned;
        }

        function normalizeCity(city) {
            const cleaned = String(city || "")
                .trim()
                .replace(/\s+/g, " ");

            if (!cleaned) {
                return "";
            }

            const lookupKey = normalizeLookupText(cleaned);

            if (cityAliases[lookupKey]) {
                return cityAliases[lookupKey];
            }

            if (canonicalCityLookup[lookupKey]) {
                return canonicalCityLookup[lookupKey];
            }

            return cleaned;
        }

        function parseCSV(csvText) {
            const rows = [];

            let currentRow = [];
            let currentValue = "";
            let insideQuotes = false;

            for (let index = 0; index < csvText.length; index++) {
                const character = csvText[index];
                const nextCharacter = csvText[index + 1];

                if (
                    character === '"' &&
                    insideQuotes &&
                    nextCharacter === '"'
                ) {
                    currentValue += '"';
                    index++;
                    continue;
                }

                if (character === '"') {
                    insideQuotes = !insideQuotes;
                    continue;
                }

                if (character === "," && !insideQuotes) {
                    currentRow.push(currentValue.trim());
                    currentValue = "";
                    continue;
                }

                if (
                    (character === "\n" || character === "\r") &&
                    !insideQuotes
                ) {
                    if (
                        character === "\r" &&
                        nextCharacter === "\n"
                    ) {
                        index++;
                    }

                    currentRow.push(currentValue.trim());

                    if (currentRow.some((cell) => cell !== "")) {
                        rows.push(currentRow);
                    }

                    currentRow = [];
                    currentValue = "";
                    continue;
                }

                currentValue += character;
            }

            currentRow.push(currentValue.trim());

            if (currentRow.some((cell) => cell !== "")) {
                rows.push(currentRow);
            }

            return rows;
        }

        function escapeHTML(value) {
            return String(value || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function createMarkerIcon() {
            return L.divIcon({
                className: "",
                html: '<div class="research-marker"></div>',
                iconSize: [14, 14],
                iconAnchor: [7, 7],
                tooltipAnchor: [0, -9]
            });
        }

        function resolveLocation(rawCity, rawCountry) {
            const city = normalizeCity(rawCity);
            const country = normalizeCountry(rawCountry);

            if (city && hubs[city]) {
                return {
                    coordinates: hubs[city],
                    label: country ? `${city}, ${country}` : city
                };
            }

            if (!city && countryFallbacks[country]) {
                return {
                    coordinates: countryFallbacks[country],
                    label: country
                };
            }

            return null;
        }

        async function loadData() {
            markerClusters.clearLayers();

            try {
                const response = await fetch(csvUrl, {
                    cache: "no-store"
                });

                if (!response.ok) {
                    throw new Error(
                        `The spreadsheet returned status ${response.status}.`
                    );
                }

                const csvText = await response.text();
                const rows = parseCSV(csvText);

                if (rows.length < 2) {
                    throw new Error(
                        "The spreadsheet does not contain location rows."
                    );
                }

                /*
                 * Skip the spreadsheet header row.
                 */
                const dataRows = rows.slice(1);
                const mapBounds = [];
                const unmatchedLocations = [];

                dataRows.forEach((columns) => {
                    const rawCity = columns[0] || "";
                    const rawCountry = columns[1] || "";

                    if (!rawCity.trim() && !rawCountry.trim()) {
                        return;
                    }

                    const location = resolveLocation(
                        rawCity,
                        rawCountry
                    );

                    if (!location) {
                        unmatchedLocations.push({
                            city: rawCity,
                            country: rawCountry
                        });

                        return;
                    }

                    /*
                     * Each row receives its own marker, including duplicate
                     * cities and locations sharing identical coordinates.
                     */
                    const marker = L.marker(location.coordinates, {
                        icon: createMarkerIcon(),
                        keyboard: true,
                        title: location.label
                    });

                    marker.bindTooltip(
                        escapeHTML(location.label),
                        {
                            direction: "top",
                            opacity: 1
                        }
                    );

                    markerClusters.addLayer(marker);
                    mapBounds.push(location.coordinates);
                });

                if (mapBounds.length > 0) {
                    map.fitBounds(L.latLngBounds(mapBounds), {
                        padding: [30, 30],
                        maxZoom: 4
                    });
                }

                if (unmatchedLocations.length > 0) {
                    console.group(
                        "Research map: locations that could not be mapped"
                    );

                    unmatchedLocations.forEach((location) => {
                        console.warn(
                            `${location.city || "(blank city)"}, ` +
                            `${location.country || "(blank country)"}`
                        );
                    });

                    console.groupEnd();
                }
            } catch (error) {
                console.error(
                    "Error loading research map data:",
                    error
                );
            } finally {
                window.setTimeout(() => {
                    map.invalidateSize();
                }, 150);
            }
        }

        loadData();

        window.addEventListener("resize", () => {
            map.invalidateSize();
        });
    </script>
</body>
</html>
