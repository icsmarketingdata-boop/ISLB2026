    <style>
        :root {
            --marker-colour: #077F9C;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        #map {
            width: 100%;
            height: 400px;
            min-height: 400px;
            overflow: hidden;
            background: #eef2f1;
            border-radius: 20px;
        }

        .research-icon {
            overflow: visible !important;
            background: transparent !important;
            border: 0 !important;
        }

        .research-marker {
            position: absolute;
            top: 0;
            left: 0;
            width: 14px;
            height: 14px;
            background: var(--marker-colour);
            border: 2px solid #ffffff;
            border-radius: 50%;
            box-shadow:
                0 0 0 0 rgba(7, 127, 156, 0.58),
                0 2px 8px rgba(7, 127, 156, 0.55);
            animation: marker-pulse 2.2s ease-out infinite;
            cursor: pointer;
        }

        @keyframes marker-pulse {
            0% {
                box-shadow:
                    0 0 0 0 rgba(7, 127, 156, 0.58),
                    0 2px 8px rgba(7, 127, 156, 0.55);
            }

            65% {
                box-shadow:
                    0 0 0 10px rgba(7, 127, 156, 0),
                    0 3px 11px rgba(7, 127, 156, 0.42);
            }

            100% {
                box-shadow:
                    0 0 0 0 rgba(7, 127, 156, 0),
                    0 2px 8px rgba(7, 127, 156, 0.55);
            }
        }

        .leaflet-tooltip {
            padding: 8px 11px;
            background: #ffffff !important;
            border: 1px solid rgba(7, 127, 156, 0.4) !important;
            border-radius: 8px;
            box-shadow:
                0 0 0 2px rgba(7, 127, 156, 0.08),
                0 6px 18px rgba(7, 127, 156, 0.28);
            color: #231f20 !important;
            font-size: 13px;
            font-weight: 600;
        }

        .leaflet-tooltip-top::before {
            border-top-color: rgba(7, 127, 156, 0.4) !important;
        }

        .leaflet-control-zoom {
            overflow: hidden;
            border: 0 !important;
            border-radius: 10px !important;
            box-shadow: 0 5px 16px rgba(7, 127, 156, 0.3) !important;
        }

        .leaflet-control-zoom a {
            color: var(--marker-colour) !important;
        }

        .leaflet-control-attribution {
            background: rgba(255, 255, 255, 0.9) !important;
            color: #666666 !important;
        }

        @media (prefers-reduced-motion: reduce) {
            .research-marker {
                animation: none;
            }
        }

        @media (max-width: 640px) {
            #map {
                height: 400px;
                min-height: 400px;
                border-radius: 14px;
            }
        }
    </style>
</head>

                subdomains: "abcd",
                maxZoom: 20
            }
        ).addTo(map);

        const markerLayer = L.layerGroup().addTo(map);

        function escapeHTML(value) {
            return String(value || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        /*
         * Creates a compact spiral in pixels around locations that have
         * multiple dots at the same latitude and longitude.
         */
        function getDotOffset(index) {
            if (index === 0) {
                return {
                    x: 0,
                    y: 0
                };
            }

            const goldenAngle = 2.399963229728653;
            const radius = 6.5 * Math.sqrt(index);
            const angle = index * goldenAngle;

            return {
                x: Math.cos(angle) * radius,
                y: Math.sin(angle) * radius
            };
        }

        function createMarkerIcon(
            offsetX,
            offsetY,
            animationDelay
        ) {
            const safeX = Number(offsetX.toFixed(2));
            const safeY = Number(offsetY.toFixed(2));

            return L.divIcon({
                className: "research-icon",
                html: `
                    <div
                        class="research-marker"
                        style="
                            transform: translate(${safeX}px, ${safeY}px);
                            animation-delay: ${animationDelay}s;
                        "
                    ></div>
                `,
                iconSize: [14, 14],
                iconAnchor: [7, 7],
                tooltipAnchor: [
                    safeX,
                    safeY - 10
                ]
            });
        }

        function addEmbeddedMarkers() {
            markerLayer.clearLayers();

            const coordinateCounts = new Map();

            let totalDots = 0;

            locations.forEach((location) => {
                const coordinateKey =
                    `${location.lat.toFixed(5)},` +
                    `${location.lng.toFixed(5)}`;

                for (
                    let localIndex = 0;
                    localIndex < location.count;
                    localIndex++
                ) {
                    const duplicateIndex =
                        coordinateCounts.get(coordinateKey) || 0;

                    coordinateCounts.set(
                        coordinateKey,
                        duplicateIndex + 1
                    );

                    const offset =
                        getDotOffset(duplicateIndex);

                    const animationDelay =
                        -((totalDots % 14) * 0.14);

                    const marker = L.marker(
                        [location.lat, location.lng],
                        {
                            icon: createMarkerIcon(
                                offset.x,
                                offset.y,
                                animationDelay
                            ),
                            keyboard: true,
                            title: location.label
                        }
                    );

                    marker.bindTooltip(
                        escapeHTML(location.label),
                        {
                            direction: "top",
                            opacity: 1
                        }
                    );

                    marker.addTo(markerLayer);
                    totalDots++;
                }
            });

            map.setView(
                STARTING_CENTER,
                STARTING_ZOOM,
                {
                    animate: false
                }
            );

            console.info(
                `Research map created ${totalDots} dots.`
            );

            if (totalDots === EXPECTED_DOT_COUNT) {
                console.info(
                    `All ${EXPECTED_DOT_COUNT} expected dots were added successfully.`
                );
            } else {
                console.warn(
                    `Expected ${EXPECTED_DOT_COUNT} dots, but ${totalDots} were added.`
                );
            }
        }

        addEmbeddedMarkers();

            map.invalidateSize();

            map.setView(

                STARTING_ZOOM,
                {
                    animate: false
                }
            );
        }, 150);

            map.invalidateSize();
        });
