<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ISLB 2026 | Research Map</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        :root {
            --marker-colour: #077F9C;
            --marker-shadow: rgba(7, 127, 156, 0.45);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        #map {
            width: 100%;
            height: 680px;
            min-height: 420px;
            background: #eef2f1;
        }

        .research-marker {
            width: 14px;
            height: 14px;
            background: var(--marker-colour);
            border: 2px solid #ffffff;
            border-radius: 50%;
            box-shadow:
                0 0 0 3px rgba(7, 127, 156, 0.14),
                0 3px 9px var(--marker-shadow);
        }

        .leaflet-tooltip {
            padding: 8px 11px;
            background: #ffffff !important;
            border: 1px solid rgba(7, 127, 156, 0.35) !important;
            border-radius: 8px;
            box-shadow:
                0 0 0 2px rgba(7, 127, 156, 0.08),
                0 6px 18px rgba(7, 127, 156, 0.25);
            color: #231f20 !important;
            font-size: 13px;
            font-weight: 600;
        }

        .leaflet-tooltip-top::before {
            border-top-color: rgba(7, 127, 156, 0.35) !important;
        }

        .leaflet-control-zoom {
            overflow: hidden;
            border: 0 !important;
            border-radius: 10px !important;
            box-shadow: 0 5px 16px rgba(7, 127, 156, 0.25) !important;
        }

        .leaflet-control-zoom a {
            color: var(--marker-colour) !important;
        }

        .leaflet-control-attribution {
            background: rgba(255, 255, 255, 0.88) !important;
            color: #666666 !important;
        }

        @media (max-width: 900px) {
            #map {
                height: 560px;
            }
        }

        @media (max-width: 640px) {
            #map {
                height: 480px;
            }
        }
    </style>
</head>

<body>
    <div
        id="map"
        role="application"
        aria-label="Interactive map of research locations"
    ></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const EXPECTED_LOCATION_COUNT = 182;

        const csvUrl =

        /*

         *

        const hubs = {

            "Montreal": [45.5019, -73.5674],

            "Shenzhen": [22.5431, 114.0579],
            "Hangzhou": [30.2741, 120.1551],

            "Cagliari": [39.2238, 9.1217],
            "Genova": [44.4056, 8.9463],
            "Biella": [45.5629, 8.0583],
            "Pisa": [43.7228, 10.4017],
            "Bologna": [44.4949, 11.3426],
            "Parma": [44.8015, 10.3279],
            "Bergamo": [45.6983, 9.6773],
            "Catania": [37.5079, 15.083],
            "Rome": [41.9028, 12.4964],
            "Milan": [45.4642, 9.19],
            "Bari": [41.1171, 16.8719],

            "Strassen": [49.6206, 6.0733],

            "Mexico City": [19.4326, -99.1332],

            "Rabat": [34.0209, -6.8416],

            "Obafemi-Owode": [6.9463, 3.505],

            "Porto": [41.1579, -8.6291],

            "Daegu": [35.8714, 128.6014],
            "Seoul": [37.5665, 126.978],

            "Madrid": [40.4168, -3.7038],
            "Hernani": [43.2662, -1.9761],
            "Galapagar": [40.5783, -4.0043],
            "Granada": [37.1773, -3.5986],
            "Valencia": [39.4699, -0.3763],
            "Barcelona": [41.3874, 2.1686],
            "Vila-seca": [41.1112, 1.1477],
            "Majadahonda": [40.4738, -3.8718],
            "Bilbao": [43.263, -2.935],
            "Santiago de Compostela": [42.8782, -8.5448],
            "Pamplona": [42.8125, -1.6458],
            "Málaga": [36.7213, -4.4214],

            "Belfast": [54.5973, -5.9301],
            "Cambridge": [52.2053, 0.1218],
            "Colchester": [51.8959, 0.8919],
            "London": [51.5074, -0.1278],

            "New York": [40.7128, -74.006],
            "Philadelphia": [39.9526, -75.1652],
            "Boca Raton": [26.3683, -80.1289],
            "West Los Angeles": [34.0412, -118.4426],
            "Porter Ranch": [34.2822, -118.5506],
            "Madison": [43.0731, -89.4012],
            "Minneapolis": [44.9778, -93.265],
            "Rochester": [43.1566, -77.6088],
            "Chicago": [41.8781, -87.6298],
            "Sparks": [39.5349, -119.7527]
        };

        /*
         * Country coordinates are used only when the city field is blank.
         *
         * These positions represent the approximate geographic centre
         * of each country.
         */
        const countryFallbacks = {
            "Argentina": [-38.4161, -63.6167],
            "Australia": [-25.2744, 133.7751],
            "Belgium": [50.5039, 4.4699],
            "Brazil": [-14.235, -51.9253],
            "Bulgaria": [42.7339, 25.4858],
            "Canada": [56.1304, -106.3468],
            "China": [35.8617, 104.1954],
            "Czech Republic": [49.8175, 15.473],
            "Egypt": [26.8206, 30.8025],
            "France": [46.2276, 2.2137],
            "Germany": [51.1657, 10.4515],
            "Greece": [39.0742, 21.8243],
            "Hungary": [47.1625, 19.5033],
            "India": [20.5937, 78.9629],
            "Israel": [31.0461, 34.8516],
            "Italy": [41.8719, 12.5674],
            "Luxembourg": [49.8153, 6.1296],
            "Mexico": [23.6345, -102.5528],
            "Morocco": [31.7917, -7.0926],
            "Netherlands": [52.1326, 5.2913],
            "New Zealand": [-40.9006, 174.886],
            "Nigeria": [9.082, 8.6753],
            "Portugal": [39.3999, -8.2245],
            "Republic of Korea": [35.9078, 127.7669],
            "Singapore": [1.3521, 103.8198],
            "Slovenia": [46.1512, 14.9955],
            "Spain": [40.4637, -3.7492],
            "Sweden": [60.1282, 18.6435],
            "Turkey": [38.9637, 35.2433],
            "United Kingdom": [55.3781, -3.436],
            "United States": [39.8283, -98.5795]
        };

        const cityAliases = {
            "c a b a": "C.A.B.A.",
            "capital federal": "C.A.B.A.",

            "montreal": "Montreal",

            "munster": "Münster",
            "hilden": "Hilden",

            "athens": "Athens",

            "naples italy": "Naples",
            "napoli": "Naples",
            "cagliari": "Cagliari",
            "milano": "Milan",
            "roma": "Rome",

            "hernani": "Hernani",
            "valencia": "Valencia",
            "vila seca": "Vila-seca",
            "malaga": "Málaga",

            "sabino arana 5": "Bilbao",

            "west los angeles": "West Los Angeles"
        };

        const map = L.map("map", {
            center: [20, 10],
            zoom: 2,
            minZoom: 1,
            maxZoom: 18,
            zoomControl: true,
            attributionControl: true,
            worldCopyJump: true
        });

        L.tileLayer(
            "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
            {
                attribution:
                    '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
                subdomains: "abcd",
                maxZoom: 20
            }
        ).addTo(map);

        const markerLayer = L.layerGroup().addTo(map);

        function normalizeLookupText(value) {
            return String(value || "")
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .replace(/[’']/g, "")
                .replace(/[.,/#!$%^&*;:{}=\-_`~()]/g, " ")
                .replace(/\s+/g, " ")
                .trim()
                .toLowerCase();
        }

        function createCanonicalCityLookup() {
            const lookup = {};

            Object.keys(hubs).forEach((city) => {
                lookup[normalizeLookupText(city)] = city;
            });

            return lookup;
        }

        const canonicalCityLookup = createCanonicalCityLookup();

        function normalizeCountry(country) {
            const cleaned = String(country || "")
                .trim()
                .replace(/\s+/g, " ");

            const lookupKey = normalizeLookupText(cleaned);

            const aliases = {
                "republic of korea": "Republic of Korea",
                "south korea": "Republic of Korea",
                "korea republic of": "Republic of Korea",

                "czechia": "Czech Republic",

                "uk": "United Kingdom",
                "u k": "United Kingdom",

                "usa": "United States",
                "u s a": "United States",
                "united states of america": "United States"
            };

            return aliases[lookupKey] || cleaned;
        }

        function normalizeCity(city) {
            const cleaned = String(city || "")
                .trim()
                .replace(/\s+/g, " ");

            if (!cleaned) {
                return "";
            }

            const lookupKey = normalizeLookupText(cleaned);

            if (cityAliases[lookupKey]) {
                return cityAliases[lookupKey];
            }

            if (canonicalCityLookup[lookupKey]) {
                return canonicalCityLookup[lookupKey];
            }

            return cleaned;
        }

        function parseCSV(csvText) {
            const rows = [];

            let currentRow = [];
            let currentValue = "";
            let insideQuotes = false;

            for (let index = 0; index < csvText.length; index++) {
                const character = csvText[index];
                const nextCharacter = csvText[index + 1];

                if (
                    character === '"' &&
                    insideQuotes &&
                    nextCharacter === '"'
                ) {
                    currentValue += '"';
                    index++;
                    continue;
                }

                if (character === '"') {
                    insideQuotes = !insideQuotes;
                    continue;
                }

                if (character === "," && !insideQuotes) {
                    currentRow.push(currentValue.trim());
                    currentValue = "";
                    continue;
                }

                if (
                    (character === "\n" || character === "\r") &&
                    !insideQuotes
                ) {
                    if (
                        character === "\r" &&
                        nextCharacter === "\n"
                    ) {
                        index++;
                    }

                    currentRow.push(currentValue.trim());

                    if (currentRow.some((cell) => cell !== "")) {
                        rows.push(currentRow);
                    }

                    currentRow = [];
                    currentValue = "";
                    continue;
                }

                currentValue += character;
            }

            currentRow.push(currentValue.trim());

            if (currentRow.some((cell) => cell !== "")) {
                rows.push(currentRow);
            }

            return rows;
        }

        function escapeHTML(value) {
            return String(value || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function createMarkerIcon() {
            return L.divIcon({
                className: "",
                html: '<div class="research-marker"></div>',
                iconSize: [14, 14],
                iconAnchor: [7, 7],
                tooltipAnchor: [0, -9]
            });
        }

        function resolveLocation(rawCity, rawCountry) {
            const city = normalizeCity(rawCity);
            const country = normalizeCountry(rawCountry);

            if (city && hubs[city]) {
                return {
                    coordinates: hubs[city],
                    label: country
                        ? `${city}, ${country}`
                        : city
                };
            }

            if (country && countryFallbacks[country]) {
                return {
                    coordinates: countryFallbacks[country],
                    label: country
                };
            }

            return null;
        }

        /*
         * Moves duplicate markers into compact circular rings around the
         * original location so every record remains individually visible.
         */
        function createOffsetCoordinates(
            coordinates,
            duplicateIndex
        ) {
            if (duplicateIndex === 0) {
                return [...coordinates];
            }

            const originalLatitude = coordinates[0];
            const originalLongitude = coordinates[1];

            /*
             * Eight dots per ring provides clearer spacing than ten dots
             * while keeping the group close to its correct location.
             */
            const dotsPerRing = 8;

            const ring =
                Math.floor(
                    (duplicateIndex - 1) / dotsPerRing
                ) + 1;

            const positionInRing =
                (duplicateIndex - 1) % dotsPerRing;

            const angle =
                (positionInRing / dotsPerRing) *
                Math.PI *
                2;

            /*
             * Approximately 2–3 kilometres for the first ring.
             */
            const radius = 0.025 * ring;

            const latitudeOffset =
                Math.sin(angle) * radius;

            const longitudeCorrection = Math.max(
                Math.abs(
                    Math.cos(
                        originalLatitude *
                        Math.PI /
                        180
                    )
                ),
                0.25
            );

            const longitudeOffset =
                (Math.cos(angle) * radius) /
                longitudeCorrection;

            return [
                originalLatitude + latitudeOffset,
                originalLongitude + longitudeOffset
            ];
        }

        async function loadData() {
            markerLayer.clearLayers();

            try {
                const response = await fetch(csvUrl, {
                    cache: "no-store"
                });

                if (!response.ok) {
                    throw new Error(
                        `The spreadsheet returned status ${response.status}.`
                    );
                }

                const csvText = await response.text();
                const rows = parseCSV(csvText);

                if (rows.length < 2) {
                    throw new Error(
                        "The spreadsheet does not contain location rows."
                    );
                }

                /*
                 * The first row is treated as a heading row.
                 */
                const dataRows = rows.slice(1);

                const mapBounds = [];
                const unmatchedLocations = [];
                const coordinateCounts = new Map();

                let markerCount = 0;

                dataRows.forEach((columns, rowIndex) => {
                    const rawCity = columns[0] || "";
                    const rawCountry = columns[1] || "";

                    /*
                     * Ignore completely blank spreadsheet rows.
                     */
                    if (
                        !rawCity.trim() &&
                        !rawCountry.trim()
                    ) {
                        return;
                    }

                    const location = resolveLocation(
                        rawCity,
                        rawCountry
                    );

                    if (!location) {
                        unmatchedLocations.push({
                            row: rowIndex + 2,
                            city: rawCity,
                            country: rawCountry
                        });

                        return;
                    }

                    const originalLatitude =
                        location.coordinates[0];

                    const originalLongitude =
                        location.coordinates[1];

                    const coordinateKey =
                        `${originalLatitude.toFixed(5)},` +
                        `${originalLongitude.toFixed(5)}`;

                    const duplicateIndex =
                        coordinateCounts.get(
                            coordinateKey
                        ) || 0;

                    coordinateCounts.set(
                        coordinateKey,
                        duplicateIndex + 1
                    );

                    const displayedCoordinates =
                        createOffsetCoordinates(
                            location.coordinates,
                            duplicateIndex
                        );

                    const marker = L.marker(
                        displayedCoordinates,
                        {
                            icon: createMarkerIcon(),
                            keyboard: true,
                            title: location.label
                        }
                    );

                    marker.bindTooltip(
                        escapeHTML(location.label),
                        {
                            direction: "top",
                            opacity: 1
                        }
                    );

                    marker.addTo(markerLayer);

                    mapBounds.push(displayedCoordinates);
                    markerCount++;
                });

                if (mapBounds.length > 0) {
                    map.fitBounds(
                        L.latLngBounds(mapBounds),
                        {
                            padding: [30, 30],
                            maxZoom: 4
                        }
                    );
                }

                console.info(
                    `Research map created ${markerCount} markers.`
                );

                if (markerCount === EXPECTED_LOCATION_COUNT) {
                    console.info(
                        `All ${EXPECTED_LOCATION_COUNT} expected locations were mapped successfully.`
                    );
                } else {
                    console.warn(
                        `Expected ${EXPECTED_LOCATION_COUNT} markers, but ${markerCount} were created.`
                    );
                }

                if (unmatchedLocations.length > 0) {
                    console.group(
                        "Research map: locations that could not be mapped"
                    );

                    unmatchedLocations.forEach((location) => {
                        console.warn(
                            `Row ${location.row}: ` +
                            `${location.city || "(blank city)"}, ` +
                            `${location.country || "(blank country)"}`
                        );
                    });

                    console.groupEnd();
                }
            } catch (error) {
                console.error(
                    "Error loading research map data:",
                    error
                );
            } finally {
                window.setTimeout(() => {
                    map.invalidateSize();
                }, 150);
            }
        }

        loadData();

        window.addEventListener("resize", () => {
            map.invalidateSize();
        });
    </script>
</body>
</html>
